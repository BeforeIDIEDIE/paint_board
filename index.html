<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>paint</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎨 paint board</h1>
        
        <div class="toolbar">
            <div class="tool-group">
                <label>색상:</label>
                <input type="color" id="colorPicker" value="#000000">
            </div>

            <div class="tool-group">
                <label>브러시 크기:</label>
                <input type="range" id="brushSize" min="1" max="50" value="5">
                <span class="size-display" id="sizeDisplay">5</span>
            </div>

            <div class="tool-group">
                <button id="drawBtn" class="active">✏️ draw</button>
                <button id="eraserBtn" class="eraser">🧹 eraser</button>
            </div>

            <div class="tool-group">
                <span class="mode-indicator mode-draw" id="modeIndicator">draw mode</span>
            </div>

            <div class="tool-group">
                <button id="clearBtn" class="clear">🗑️ erase all</button>
                <button id="saveBtn" class="save">💾 save</button>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="canvas" width="800" height="600"></canvas>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
